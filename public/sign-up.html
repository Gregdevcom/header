<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | Header</title>
    <link rel="icon" href="HeaDer.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ephesis&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        overscroll-behavior: none;
      }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(160deg, #1a1a2e, #16213e, #0f3460);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        overscroll-behavior: none;
        overflow-x: hidden;
        width: 100%;
        height: 100%;
      }

      /* Main card */
      .card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 30px;
        padding: 50px 40px;
        width: 100%;
        max-width: 420px;
        animation: cardEntry 0.6s ease-out;
      }

      @keyframes cardEntry {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Header */
      .header {
        text-align: center;
        margin-bottom: 35px;
      }

      .logo {
        font-size: 38px;
        font-weight: 300;
        letter-spacing: 2px;
        color: #fff;
        text-decoration: none;
        display: inline-block;
        margin-bottom: 8px;
        font-family: "Ephesis", cursive;
        font-weight: 400;
      }

      .subtitle {
        color: rgba(255, 255, 255, 0.4);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 3px;
      }

      /* Social buttons */
      .social-buttons {
        margin-bottom: 25px;
      }

      .google-btn {
        width: 100%;
        padding: 16px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.05);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-size: 14px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.9);
        transition: all 0.3s ease;
        font-family: inherit;
        text-decoration: none;
        letter-spacing: 0.5px;
      }

      .google-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.25);
        transform: translateY(-2px);
      }

      .google-btn svg {
        flex-shrink: 0;
      }

      /* Divider */
      .divider {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 25px;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
      }

      .divider span {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.4);
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      /* Form */
      form {
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 11px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.5);
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .input-wrapper {
        position: relative;
      }

      .input-wrapper i.input-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.3);
        font-size: 20px;
        transition: color 0.3s;
      }

      .toggle-password {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.3);
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.3s;
      }

      .toggle-password:hover {
        color: rgba(255, 255, 255, 0.6);
      }

      .toggle-password i {
        font-size: 18px;
      }

      input {
        width: 100%;
        padding: 16px 50px;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        font-size: 15px;
        color: #fff;
        transition: all 0.3s ease;
        outline: none;
        font-family: inherit;
      }

      input:focus {
        background: rgba(0, 0, 0, 0.3);
        border-color: rgba(255, 255, 255, 0.25);
      }

      .input-wrapper:focus-within i.input-icon {
        color: rgba(255, 255, 255, 0.6);
      }

      input::placeholder {
        color: rgba(255, 255, 255, 0.3);
      }

      /* Input states */
      .input-group.error input {
        border-color: #ff4757;
        background: rgba(255, 71, 87, 0.1);
      }

      .input-group.error .input-icon {
        color: #ff4757 !important;
      }

      .input-group.success input {
        border-color: #2ed573;
        background: rgba(46, 213, 115, 0.1);
      }

      .input-group.success .input-icon {
        color: #2ed573 !important;
      }

      /* Field error */
      .field-error {
        display: none;
        font-size: 12px;
        color: #ff6b81;
        margin-top: 8px;
        animation: slideIn 0.3s ease;
      }

      .field-error.show {
        display: block;
      }

      .field-error ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .field-error li {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 0;
      }

      .field-error li::before {
        content: "";
        width: 4px;
        height: 4px;
        background: #ff6b81;
        border-radius: 50%;
        flex-shrink: 0;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Password strength meter */
      .strength-meter {
        margin-top: 14px;
      }

      .strength-bar {
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        overflow: hidden;
        display: flex;
        gap: 4px;
      }

      .strength-segment {
        flex: 1;
        height: 100%;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.1);
        transition: all 0.4s ease;
      }

      .strength-segment.active.weak {
        background: #ff4757;
      }
      .strength-segment.active.fair {
        background: #ffa502;
      }
      .strength-segment.active.good {
        background: #7bed9f;
      }
      .strength-segment.active.strong {
        background: #2ed573;
      }

      .strength-text {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        font-size: 11px;
      }

      .strength-label {
        color: rgba(255, 255, 255, 0.4);
        font-weight: 500;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .strength-value {
        font-weight: 600;
        transition: color 0.3s;
        display: none;
      }

      .strength-value.weak {
        color: #ff4757;
        display: block;
      }
      .strength-value.fair {
        color: #ffa502;
        display: block;
      }
      .strength-value.good {
        color: #7bed9f;
        display: block;
      }
      .strength-value.strong {
        color: #2ed573;
        display: block;
      }

      /* Requirements checklist */
      .requirements {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 14px;
      }

      .requirement {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.4);
        transition: color 0.3s;
      }

      .requirement i {
        font-size: 14px;
        transition: all 0.3s;
      }

      .requirement.met {
        color: #2ed573;
      }

      .requirement.met i {
        transform: scale(1.1);
      }

      /* Shake animation */
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        10%,
        30%,
        50%,
        70%,
        90% {
          transform: translateX(-4px);
        }
        20%,
        40%,
        60%,
        80% {
          transform: translateX(4px);
        }
      }

      .input-group.shake .input-wrapper {
        animation: shake 0.5s ease;
      }

      .requirements.highlight-missing .requirement:not(.met) {
        color: #ff4757;
        animation: pulse 0.5s ease;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      /* Submit button */
      .primary-btn {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: rgba(255, 255, 255, 0.9);
        padding: 16px 24px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: inherit;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .primary-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
      }

      .primary-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
      }

      /* Error message */
      .errorMsg {
        display: none;
        padding: 14px 18px;
        border-radius: 12px;
        font-size: 13px;
        margin-top: 20px;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        animation: messageIn 0.4s ease;
        background: rgba(255, 71, 87, 0.15);
        border: 1px solid rgba(255, 71, 87, 0.3);
        color: #ff6b81;
      }

      .errorMsg.show {
        display: flex;
      }

      @keyframes messageIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Switch auth */
      .switch-auth {
        margin-top: 30px;
        text-align: center;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.5);
        padding-top: 25px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .link-btn {
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.7);
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        padding: 4px 8px;
        margin-left: 4px;
        padding-bottom: 5px;
        border-radius: 6px;
        transition: all 0.3s;
        text-decoration: none;
      }

      .link-btn:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.05);
      }

      /* Spinner animation */
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .ph-spinner {
        animation: spin 1s linear infinite;
      }

      /* Responsive */
      @media (max-width: 500px) {
        body {
          padding: 16px;
        }

        .card {
          padding: 40px 28px;
          border-radius: 24px;
        }

        .logo {
          font-size: 24px;
        }

        .requirements {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <!-- Main card -->
    <div class="card">
      <div class="header">
        <a href="/" class="logo">Auris</a>
        <p class="subtitle">Create Account</p>
      </div>

      <div class="social-buttons">
        <a href="/auth/google" class="google-btn">
          <svg width="18" height="18" viewBox="0 0 18 18">
            <path
              fill="#4285F4"
              d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"
            />
            <path
              fill="#34A853"
              d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"
            />
            <path
              fill="#FBBC05"
              d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"
            />
            <path
              fill="#EA4335"
              d="M8.98 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59a8 8 0 0 0-12.17 2.07l2.67 2.07a4.8 4.8 0 0 1 4.48-3.9z"
            />
          </svg>
          Continue with Google
        </a>
      </div>

      <div class="divider">
        <span>or</span>
      </div>

      <form id="createAccForm">
        <div class="input-group" data-field="name">
          <label for="name">Username</label>
          <div class="input-wrapper">
            <i class="ph ph-user-circle input-icon"></i>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="User123"
              autocomplete="given-name"
            />
          </div>
          <div class="field-error" data-error="name"></div>
        </div>

        <div class="input-group" data-field="email">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <i class="ph ph-envelope input-icon"></i>
            <input
              type="text"
              id="email"
              name="email"
              placeholder="user@email.com"
              autocomplete="email"
            />
          </div>
          <div class="field-error" data-error="email"></div>
        </div>

        <div class="input-group" data-field="password">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="ph ph-lock input-icon"></i>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a strong password"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="toggle-password"
              data-target="password"
            >
              <i class="ph ph-eye"></i>
            </button>
          </div>

          <!-- Strength meter -->
          <div class="strength-meter" id="strengthMeter">
            <div class="strength-bar">
              <div class="strength-segment" data-segment="1"></div>
              <div class="strength-segment" data-segment="2"></div>
              <div class="strength-segment" data-segment="3"></div>
              <div class="strength-segment" data-segment="4"></div>
              <div class="strength-segment" data-segment="5"></div>
            </div>
            <div class="strength-text">
              <span class="strength-label">Strength</span>
              <span class="strength-value" id="strengthValue">—</span>
            </div>
          </div>

          <!-- Requirements -->
          <div class="requirements" id="requirements">
            <div class="requirement" data-req="length">
              <i class="ph ph-circle"></i>
              <span>8+ characters</span>
            </div>
            <div class="requirement" data-req="uppercase">
              <i class="ph ph-circle"></i>
              <span>Uppercase</span>
            </div>
            <div class="requirement" data-req="lowercase">
              <i class="ph ph-circle"></i>
              <span>Lowercase</span>
            </div>
            <div class="requirement" data-req="number">
              <i class="ph ph-circle"></i>
              <span>Number</span>
            </div>
            <div class="requirement" data-req="special">
              <i class="ph ph-circle"></i>
              <span>Special char</span>
            </div>
          </div>
        </div>

        <button type="submit" class="primary-btn" id="submitBtn">
          <i class="ph ph-user-plus"></i>
          Create Account
        </button>
      </form>

      <p class="errorMsg" id="errorMsg">
        <i class="ph ph-warning-circle"></i>
        <span></span>
      </p>

      <div class="switch-auth">
        Already have an account?
        <button id="logInBtn" class="link-btn">Log In</button>
      </div>
    </div>

    <script>
      const formElem = document.getElementById("createAccForm");
      const logInBtnElem = document.getElementById("logInBtn");
      const errorMsgElem = document.getElementById("errorMsg");
      const submitBtn = document.getElementById("submitBtn");
      const passwordInput = document.getElementById("password");
      const passwordGroup = document.querySelector('[data-field="password"]');
      const requirementsElem = document.getElementById("requirements");
      const strengthValue = document.getElementById("strengthValue");

      let isPasswordStrong = false;

      // Toggle password visibility
      document.querySelectorAll(".toggle-password").forEach((btn) => {
        btn.addEventListener("click", () => {
          const targetId = btn.dataset.target;
          const input = document.getElementById(targetId);
          const icon = btn.querySelector("i");

          if (input.type === "password") {
            input.type = "text";
            icon.className = "ph ph-eye-slash";
          } else {
            input.type = "password";
            icon.className = "ph ph-eye";
          }
        });
      });

      logInBtnElem.addEventListener("click", () => {
        window.location.href = "/log-in";
      });

      function clearErrors() {
        document
          .querySelectorAll(".input-group")
          .forEach((g) => g.classList.remove("error", "shake"));
        document.querySelectorAll(".field-error").forEach((e) => {
          e.classList.remove("show");
          e.innerHTML = "";
        });
        requirementsElem.classList.remove("highlight-missing");
        errorMsgElem.classList.remove("show");
        errorMsgElem.querySelector("span").innerText = "";
      }

      function showFieldErrors(errors) {
        const filteredErrors = errors.filter((err) => err.field !== "password");

        const grouped = {};
        for (const err of filteredErrors) {
          if (!grouped[err.field]) grouped[err.field] = [];
          grouped[err.field].push(err.message);
        }

        for (const [field, messages] of Object.entries(grouped)) {
          const group = document.querySelector(`[data-field="${field}"]`);
          const errorDiv = document.querySelector(`[data-error="${field}"]`);
          if (group && errorDiv) {
            group.classList.add("error");
            errorDiv.innerHTML =
              "<ul>" + messages.map((m) => `<li>${m}</li>`).join("") + "</ul>";
            errorDiv.classList.add("show");
          }
        }
      }

      function checkPasswordStrength(password) {
        const requirements = {
          length: password.length >= 8,
          uppercase: /[A-Z]/.test(password),
          lowercase: /[a-z]/.test(password),
          number: /[0-9]/.test(password),
          special: /[^a-zA-Z0-9]/.test(password),
        };

        for (const [req, met] of Object.entries(requirements)) {
          const el = document.querySelector(`[data-req="${req}"]`);
          if (el) {
            el.classList.toggle("met", met);
            el.querySelector("i").className = met
              ? "ph-fill ph-check-circle"
              : "ph ph-circle";
          }
        }

        const metCount = Object.values(requirements).filter(Boolean).length;
        const segments = document.querySelectorAll(".strength-segment");

        let strengthClass = "";
        let strengthText = "—";

        if (password.length === 0) {
          strengthText = "—";
        } else if (metCount === 1) {
          strengthClass = "weak";
          strengthText = "Weak";
        } else if (metCount === 2) {
          strengthClass = "fair";
          strengthText = "Fair";
        } else if (metCount === 3) {
          strengthClass = "fair";
          strengthText = "Fair";
        } else if (metCount === 4) {
          strengthClass = "good";
          strengthText = "Good";
        } else if (metCount === 5) {
          strengthClass = "strong";
          strengthText = "Strong";
        }

        segments.forEach((seg, i) => {
          seg.classList.remove("active", "weak", "fair", "good", "strong");
          if (password.length > 0 && i < metCount) {
            seg.classList.add("active", strengthClass);
          }
        });

        strengthValue.textContent = strengthText;
        strengthValue.className = "strength-value " + strengthClass;

        isPasswordStrong = metCount === 5;

        return requirements;
      }

      passwordInput.addEventListener("input", () => {
        checkPasswordStrength(passwordInput.value);
        passwordGroup.classList.remove("error", "shake");
        requirementsElem.classList.remove("highlight-missing");
      });

      formElem.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearErrors();

        if (!isPasswordStrong) {
          passwordGroup.classList.add("shake");
          requirementsElem.classList.add("highlight-missing");
          passwordInput.focus();

          setTimeout(() => {
            passwordGroup.classList.remove("shake");
          }, 500);

          return;
        }

        const formData = new FormData(formElem);
        const data = Object.fromEntries(formData.entries());

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="ph ph-spinner"></i> Creating...';

        try {
          const response = await fetch("/sign-up", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });

          if (response.ok) {
            window.location.href = "/content";
          } else if (response.status === 400) {
            const errors = await response.json();
            showFieldErrors(errors);
          } else if (response.status === 429) {
            errorMsgElem.querySelector("span").innerText =
              "Too many attempts. Please wait and try again.";
            errorMsgElem.classList.add("show");
          } else {
            errorMsgElem.querySelector("span").innerText =
              "Something went wrong. Try a different email?";
            errorMsgElem.classList.add("show");
          }
        } catch (e) {
          console.log(e);
          errorMsgElem.querySelector("span").innerText =
            "Connection error. Please try again later.";
          errorMsgElem.classList.add("show");
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML =
            '<i class="ph ph-user-plus"></i> Create Account';
        }
      });
    </script>
  </body>
</html>
