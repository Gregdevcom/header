<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password | Header</title>
    <link rel="icon" href="HeaDer.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ephesis&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        overscroll-behavior: none;
      }

      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(160deg, #1a1a2e, #16213e, #0f3460);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: hidden;
        padding: 20px;
      }

      /* Main card */
      .card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 30px;
        padding: 50px 40px;
        width: 100%;
        max-width: 420px;
        animation: cardEntry 0.6s ease-out;
      }

      @keyframes cardEntry {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Header */
      .header {
        text-align: center;
        margin-bottom: 35px;
      }

      .logo {
        font-size: 38px;
        font-weight: 300;
        letter-spacing: 2px;
        color: #fff;
        text-decoration: none;
        display: inline-block;
        margin-bottom: 8px;
        font-family: "Ephesis", cursive;
        font-weight: 400;
      }

      .subtitle {
        color: rgba(255, 255, 255, 0.4);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 3px;
      }

      /* Form */
      form {
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 11px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.5);
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .input-wrapper {
        position: relative;
      }

      .input-wrapper i.input-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.3);
        font-size: 20px;
        transition: color 0.3s;
      }

      .toggle-password {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.3);
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.3s;
      }

      .toggle-password:hover {
        color: rgba(255, 255, 255, 0.6);
      }

      .toggle-password i {
        font-size: 18px;
      }

      input {
        width: 100%;
        padding: 16px 50px;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        font-size: 15px;
        color: #fff;
        transition: all 0.3s ease;
        outline: none;
        font-family: inherit;
      }

      input:focus {
        background: rgba(0, 0, 0, 0.3);
        border-color: rgba(255, 255, 255, 0.25);
      }

      .input-wrapper:focus-within i.input-icon {
        color: rgba(255, 255, 255, 0.6);
      }

      input::placeholder {
        color: rgba(255, 255, 255, 0.3);
      }

      /* Input states */
      .input-group.error input {
        border-color: #ff4757;
        background: rgba(255, 71, 87, 0.1);
      }

      .input-group.error .input-icon {
        color: #ff4757 !important;
      }

      .input-group.success input {
        border-color: #2ed573;
        background: rgba(46, 213, 115, 0.1);
      }

      .input-group.success .input-icon {
        color: #2ed573 !important;
      }

      /* Field error */
      .field-error {
        display: none;
        font-size: 12px;
        color: #ff6b81;
        margin-top: 8px;
        animation: slideIn 0.3s ease;
      }

      .field-error.show {
        display: block;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Password strength meter */
      .strength-meter {
        margin-top: 14px;
      }

      .strength-bar {
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        overflow: hidden;
        display: flex;
        gap: 4px;
      }

      .strength-segment {
        flex: 1;
        height: 100%;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.1);
        transition: all 0.4s ease;
      }

      .strength-segment.active.weak {
        background: #ff4757;
      }
      .strength-segment.active.fair {
        background: #ffa502;
      }
      .strength-segment.active.good {
        background: #7bed9f;
      }
      .strength-segment.active.strong {
        background: #2ed573;
      }

      .strength-text {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        font-size: 11px;
      }

      .strength-label {
        color: rgba(255, 255, 255, 0.4);
        font-weight: 500;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .strength-value {
        font-weight: 600;
        transition: color 0.3s;
        display: none;
      }

      .strength-value.weak {
        color: #ff4757;
        display: block;
      }
      .strength-value.fair {
        color: #ffa502;
        display: block;
      }
      .strength-value.good {
        color: #7bed9f;
        display: block;
      }
      .strength-value.strong {
        color: #2ed573;
        display: block;
      }

      /* Requirements checklist */
      .requirements {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 14px;
        margin-bottom: 10px;
      }

      .requirement {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.4);
        transition: color 0.3s;
      }

      .requirement i {
        font-size: 14px;
        transition: all 0.3s;
      }

      .requirement.met {
        color: #2ed573;
      }

      .requirement.met i {
        transform: scale(1.1);
      }

      /* Match indicator */
      .match-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        font-size: 12px;
        opacity: 0;
        transform: translateY(-5px);
        transition: all 0.3s ease;
      }

      .match-indicator.show {
        opacity: 1;
        transform: translateY(0);
      }

      .match-indicator.match {
        color: #2ed573;
      }

      .match-indicator.no-match {
        color: #ff4757;
      }

      .match-indicator i {
        font-size: 16px;
      }

      /* Submit button - glass morphism */
      .primary-btn {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: rgba(255, 255, 255, 0.9);
        padding: 16px 24px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: -10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: inherit;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .primary-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
      }

      .primary-btn:active {
        transform: translateY(0);
      }

      .primary-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
      }

      .primary-btn i {
        font-size: 18px;
      }

      /* Messages */
      .errorMsg,
      .successMsg {
        display: none;
        padding: 14px 18px;
        border-radius: 12px;
        font-size: 13px;
        margin-top: 20px;
        align-items: center;
        gap: 10px;
        text-align: left;
        animation: messageIn 0.4s ease;
      }

      .errorMsg {
        background: rgba(255, 71, 87, 0.15);
        border: 1px solid rgba(255, 71, 87, 0.3);
        color: #ff6b81;
      }

      .successMsg {
        background: rgba(46, 213, 115, 0.15);
        border: 1px solid rgba(46, 213, 115, 0.3);
        color: #7bed9f;
      }

      .errorMsg.show,
      .successMsg.show {
        display: flex;
      }

      .errorMsg i,
      .successMsg i {
        font-size: 18px;
        flex-shrink: 0;
      }

      @keyframes messageIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Back link */
      .back-link {
        margin-top: 30px;
        text-align: center;
        padding-top: 25px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .link-btn {
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.5);
        font-weight: 500;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        padding: 8px 16px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s;
      }

      .link-btn:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.05);
      }

      .link-btn i {
        font-size: 16px;
        transition: transform 0.3s;
      }

      .link-btn:hover i {
        transform: translateX(-3px);
      }

      /* Spinner */
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .ph-spinner {
        animation: spin 1s linear infinite;
      }

      /* Responsive */
      @media (max-width: 500px) {
        body {
          padding: 16px;
        }

        .card {
          padding: 40px 28px;
          border-radius: 24px;
        }

        .logo {
          font-size: 24px;
        }

        .requirements {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <!-- Main card -->
    <div class="card">
      <div class="header">
        <a href="/" class="logo">Auris</a>
        <p class="subtitle">New Password</p>
      </div>

      <form id="changePasswordForm">
        <div class="input-group" data-field="newPassword">
          <label for="newPassword">New Password</label>
          <div class="input-wrapper">
            <i class="ph ph-lock input-icon"></i>
            <input
              type="password"
              id="newPassword"
              name="newPassword"
              placeholder="Enter new password"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="toggle-password"
              data-target="newPassword"
            >
              <i class="ph ph-eye"></i>
            </button>
          </div>
          <div class="field-error" data-error="newPassword"></div>

          <!-- Strength meter -->
          <div class="strength-meter" id="strengthMeter">
            <div class="strength-bar">
              <div class="strength-segment" data-segment="1"></div>
              <div class="strength-segment" data-segment="2"></div>
              <div class="strength-segment" data-segment="3"></div>
              <div class="strength-segment" data-segment="4"></div>
              <div class="strength-segment" data-segment="5"></div>
            </div>
            <div class="strength-text">
              <span class="strength-label">Strength</span>
              <span class="strength-value" id="strengthValue">—</span>
            </div>
          </div>

          <!-- Requirements -->
          <div class="requirements">
            <div class="requirement" data-req="length">
              <i class="ph ph-circle"></i>
              <span>8+ characters</span>
            </div>
            <div class="requirement" data-req="uppercase">
              <i class="ph ph-circle"></i>
              <span>Uppercase</span>
            </div>
            <div class="requirement" data-req="lowercase">
              <i class="ph ph-circle"></i>
              <span>Lowercase</span>
            </div>
            <div class="requirement" data-req="number">
              <i class="ph ph-circle"></i>
              <span>Number</span>
            </div>
            <div class="requirement" data-req="special">
              <i class="ph ph-circle"></i>
              <span>Special char</span>
            </div>
          </div>
        </div>

        <div class="input-group" data-field="confirmPassword">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrapper">
            <i class="ph ph-lock-key input-icon"></i>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm new password"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="toggle-password"
              data-target="confirmPassword"
            >
              <i class="ph ph-eye"></i>
            </button>
          </div>
          <div class="field-error" data-error="confirmPassword"></div>
          <div class="match-indicator" id="matchIndicator">
            <i class="ph"></i>
            <span></span>
          </div>
        </div>

        <button type="submit" class="primary-btn" id="submitBtn">
          <i class="ph ph-shield-check"></i>
          Update Password
        </button>
      </form>

      <p class="errorMsg" id="errorMsg">
        <i class="ph ph-warning-circle"></i>
        <span></span>
      </p>
      <p class="successMsg" id="successMsg">
        <i class="ph ph-check-circle"></i>
        <span></span>
      </p>

      <div class="back-link">
        <button id="backBtn" class="link-btn">
          <i class="ph ph-arrow-left"></i>
          Back to Feed
        </button>
      </div>
    </div>

    <script>
      const formElem = document.getElementById("changePasswordForm");
      const newPasswordInput = document.getElementById("newPassword");
      const confirmPasswordInput = document.getElementById("confirmPassword");
      const matchIndicator = document.getElementById("matchIndicator");
      const errorMsgElem = document.getElementById("errorMsg");
      const successMsgElem = document.getElementById("successMsg");
      const submitBtn = document.getElementById("submitBtn");
      const backBtn = document.getElementById("backBtn");
      const strengthValue = document.getElementById("strengthValue");

      // Toggle password visibility
      document.querySelectorAll(".toggle-password").forEach((btn) => {
        btn.addEventListener("click", () => {
          const targetId = btn.dataset.target;
          const input = document.getElementById(targetId);
          const icon = btn.querySelector("i");

          if (input.type === "password") {
            input.type = "text";
            icon.className = "ph ph-eye-slash";
          } else {
            input.type = "password";
            icon.className = "ph ph-eye";
          }
        });
      });

      backBtn.addEventListener("click", () => {
        window.location.href = "/content";
      });

      function clearErrors() {
        document.querySelectorAll(".input-group").forEach((g) => {
          g.classList.remove("error", "success");
        });
        document.querySelectorAll(".field-error").forEach((e) => {
          e.classList.remove("show");
          e.innerHTML = "";
        });
        matchIndicator.classList.remove("show", "match", "no-match");
        errorMsgElem.classList.remove("show");
        successMsgElem.classList.remove("show");
      }

      function showFieldErrors(errors) {
        const grouped = {};
        for (const err of errors) {
          if (!grouped[err.field]) grouped[err.field] = [];
          grouped[err.field].push(err.message);
        }

        for (const [field, messages] of Object.entries(grouped)) {
          const group = document.querySelector(`[data-field="${field}"]`);
          const errorDiv = document.querySelector(`[data-error="${field}"]`);
          if (group && errorDiv) {
            group.classList.add("error");
            errorDiv.innerHTML = messages.join("<br>");
            errorDiv.classList.add("show");
          }
        }
      }

      // Password strength checker
      function checkPasswordStrength(password) {
        const requirements = {
          length: password.length >= 8,
          uppercase: /[A-Z]/.test(password),
          lowercase: /[a-z]/.test(password),
          number: /[0-9]/.test(password),
          special: /[^a-zA-Z0-9]/.test(password),
        };

        // Update requirement indicators
        for (const [req, met] of Object.entries(requirements)) {
          const el = document.querySelector(`[data-req="${req}"]`);
          if (el) {
            el.classList.toggle("met", met);
            el.querySelector("i").className = met
              ? "ph-fill ph-check-circle"
              : "ph ph-circle";
          }
        }

        // Calculate strength
        const metCount = Object.values(requirements).filter(Boolean).length;
        const segments = document.querySelectorAll(".strength-segment");

        let strengthClass = "";
        let strengthText = "—";

        if (password.length === 0) {
          strengthText = "—";
        } else if (metCount === 1) {
          strengthClass = "weak";
          strengthText = "Weak";
        } else if (metCount === 2) {
          strengthClass = "fair";
          strengthText = "Fair";
        } else if (metCount === 3) {
          strengthClass = "fair";
          strengthText = "Fair";
        } else if (metCount === 4) {
          strengthClass = "good";
          strengthText = "Good";
        } else if (metCount === 5) {
          strengthClass = "strong";
          strengthText = "Strong";
        }

        segments.forEach((seg, i) => {
          seg.classList.remove("active", "weak", "fair", "good", "strong");
          if (password.length > 0 && i < metCount) {
            seg.classList.add("active", strengthClass);
          }
        });

        strengthValue.textContent = strengthText;
        strengthValue.className = "strength-value " + strengthClass;

        return requirements;
      }

      function checkPasswordMatch() {
        const newPass = newPasswordInput.value;
        const confirmPass = confirmPasswordInput.value;
        const confirmGroup = document.querySelector(
          '[data-field="confirmPassword"]'
        );

        if (confirmPass.length === 0) {
          matchIndicator.classList.remove("show", "match", "no-match");
          confirmGroup.classList.remove("success", "error");
          return false;
        }

        matchIndicator.classList.add("show");

        if (newPass === confirmPass) {
          matchIndicator.classList.remove("no-match");
          matchIndicator.classList.add("match");
          matchIndicator.querySelector("i").className =
            "ph-fill ph-check-circle";
          matchIndicator.querySelector("span").textContent = "Passwords match";
          confirmGroup.classList.remove("error");
          confirmGroup.classList.add("success");
          return true;
        } else {
          matchIndicator.classList.remove("match");
          matchIndicator.classList.add("no-match");
          matchIndicator.querySelector("i").className = "ph ph-x-circle";
          matchIndicator.querySelector("span").textContent =
            "Passwords don't match";
          confirmGroup.classList.remove("success");
          confirmGroup.classList.add("error");
          return false;
        }
      }

      // Real-time validation
      newPasswordInput.addEventListener("input", () => {
        checkPasswordStrength(newPasswordInput.value);
        if (confirmPasswordInput.value.length > 0) {
          checkPasswordMatch();
        }
      });

      confirmPasswordInput.addEventListener("input", checkPasswordMatch);

      formElem.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearErrors();

        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        // Client-side validation
        const errors = [];
        const requirements = checkPasswordStrength(newPassword);

        if (!newPassword) {
          errors.push({
            field: "newPassword",
            message: "Password is required",
          });
        } else if (!Object.values(requirements).every(Boolean)) {
          errors.push({
            field: "newPassword",
            message: "Password doesn't meet all requirements",
          });
        }

        if (!confirmPassword) {
          errors.push({
            field: "confirmPassword",
            message: "Please confirm your password",
          });
        } else if (newPassword !== confirmPassword) {
          errors.push({
            field: "confirmPassword",
            message: "Passwords don't match",
          });
        }

        if (errors.length > 0) {
          showFieldErrors(errors);
          return;
        }

        // Disable button during submission
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="ph ph-spinner"></i> Updating...';

        try {
          const params = new URLSearchParams(window.location.search);
          const token = params.get("token");
          console.log(token);
          const response = await fetch("/change-pass", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: newPassword, token: token }),
          });

          if (response.ok) {
            successMsgElem.querySelector("span").textContent =
              "Password updated successfully!";
            successMsgElem.classList.add("show");
            formElem.reset();
            checkPasswordStrength("");
            matchIndicator.classList.remove("show");
            document
              .querySelector('[data-field="confirmPassword"]')
              .classList.remove("success");

            setTimeout(() => {
              window.location.href = "/log-in";
            }, 2000);
          } else if (response.status === 400) {
            const errors = await response.json();
            showFieldErrors(errors);
          } else if (response.status === 401) {
            errorMsgElem.querySelector("span").textContent =
              "Session expired. Please log in again.";
            errorMsgElem.classList.add("show");
          } else if (response.status === 429) {
            errorMsgElem.querySelector("span").textContent =
              "Too many attempts. Please wait and try again.";
            errorMsgElem.classList.add("show");
          } else if (response.status === 403) {
            errorMsgElem.querySelector("span").textContent =
              "New password must differ from old password!";
            errorMsgElem.classList.add("show");
          } else {
            errorMsgElem.querySelector("span").textContent =
              "Something went wrong. Please try again.";
            errorMsgElem.classList.add("show");
          }
        } catch (err) {
          console.error(err);
          errorMsgElem.querySelector("span").textContent =
            "Connection error. Please try again.";
          errorMsgElem.classList.add("show");
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML =
            '<i class="ph ph-shield-check"></i> Update Password';
        }
      });
    </script>
  </body>
</html>
