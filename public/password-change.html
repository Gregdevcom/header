<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password | Header</title>
    <link rel="icon" href="HeaDer.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
      :root {
        --primary: #2563eb;
        --primary-dark: #4669e5;
        --primary-light: #81a7f8;
        --accent: #5575f7;
        --accent-light: #84befc;
        --dark: #0a0a0f;
        --dark-soft: #13131a;
        --card-bg: rgba(20, 20, 30, 0.8);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --border: rgba(255, 255, 255, 0.08);
        --border-focus: rgba(99, 102, 241, 0.5);
        --error: #f43f5e;
        --success: #10b981;
        --warning: #f59e0b;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        background: var(--dark);
        position: relative;
        overflow-x: hidden;
      }

      /* Mesh gradient background */
      .bg-mesh {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(
            ellipse 80% 50% at 20% -10%,
            rgba(15, 55, 141, 0.25) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse 60% 40% at 80% 100%,
            rgba(22, 42, 131, 0.2) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse 50% 30% at 50% 50%,
            rgba(13, 37, 109, 0.05) 0%,
            transparent 50%
          );
      }

      /* Animated aurora effect */
      .aurora {
        position: fixed;
        top: -50%;
        left: -50%;
        right: -50%;
        bottom: -50%;
        background: conic-gradient(
          from 180deg at 50% 50%,
          transparent 0deg,
          rgba(99, 102, 241, 0.03) 60deg,
          transparent 120deg,
          rgba(168, 85, 247, 0.03) 180deg,
          transparent 240deg,
          rgba(99, 102, 241, 0.03) 300deg,
          transparent 360deg
        );
        animation: auroraRotate 60s linear infinite;
      }

      @keyframes auroraRotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /* Floating particles */
      .particles {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .particle {
        position: absolute;
        width: 2px;
        height: 2px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        animation: particleFloat 20s linear infinite;
      }

      .particle:nth-child(1) {
        left: 10%;
        animation-delay: 0s;
        animation-duration: 25s;
      }
      .particle:nth-child(2) {
        left: 20%;
        animation-delay: -5s;
        animation-duration: 20s;
      }
      .particle:nth-child(3) {
        left: 30%;
        animation-delay: -10s;
        animation-duration: 28s;
      }
      .particle:nth-child(4) {
        left: 40%;
        animation-delay: -15s;
        animation-duration: 22s;
      }
      .particle:nth-child(5) {
        left: 50%;
        animation-delay: -2s;
        animation-duration: 26s;
      }
      .particle:nth-child(6) {
        left: 60%;
        animation-delay: -8s;
        animation-duration: 24s;
      }
      .particle:nth-child(7) {
        left: 70%;
        animation-delay: -12s;
        animation-duration: 21s;
      }
      .particle:nth-child(8) {
        left: 80%;
        animation-delay: -18s;
        animation-duration: 27s;
      }
      .particle:nth-child(9) {
        left: 90%;
        animation-delay: -4s;
        animation-duration: 23s;
      }

      @keyframes particleFloat {
        0% {
          transform: translateY(100vh) scale(0);
          opacity: 0;
        }
        10% {
          opacity: 1;
          transform: translateY(90vh) scale(1);
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateY(-10vh) scale(0.5);
          opacity: 0;
        }
      }

      /* Main card */
      .card {
        position: relative;
        z-index: 10;
        background: var(--card-bg);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        padding: 48px 44px;
        border-radius: 28px;
        border: 1px solid var(--border);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05) inset,
          0 25px 50px -12px rgba(0, 0, 0, 0.5),
          0 0 100px rgba(99, 102, 241, 0.1);
        width: 100%;
        max-width: 420px;
        animation: cardEntry 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 60%;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
      }

      @keyframes cardEntry {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* Header */
      .header {
        text-align: center;
        margin-bottom: 36px;
      }

      .logo-spark {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--text-primary);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
        margin-bottom: 28px;
        transition: transform 0.3s ease;
      }

      .logo-spark:hover {
        transform: scale(1.03);
      }

      .logo-spark i {
        font-size: 20px;
        color: var(--primary-light);
        animation: sparkle 2s ease-in-out infinite;
      }

      @keyframes sparkle {
        0%,
        100% {
          opacity: 0.7;
          transform: rotate(0deg) scale(1);
        }
        50% {
          opacity: 1;
          transform: rotate(10deg) scale(1.1);
        }
      }

      /* Lock icon container */
      .lock-container {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        animation: lockPulse 3s ease-in-out infinite;
      }

      .lock-container::before {
        content: "";
        position: absolute;
        inset: -2px;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        border-radius: 22px;
        z-index: -1;
        opacity: 0.5;
        filter: blur(12px);
      }

      .lock-container i {
        font-size: 32px;
        color: white;
      }

      @keyframes lockPulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4);
        }
        50% {
          box-shadow: 0 0 0 12px rgba(99, 102, 241, 0);
        }
      }

      h2 {
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 8px;
        letter-spacing: -0.02em;
      }

      .subtitle {
        color: var(--text-secondary);
        font-size: 0.9rem;
        line-height: 1.6;
      }

      /* Form */
      form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .input-wrapper {
        position: relative;
      }

      .input-wrapper i.input-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 20px;
        transition: color 0.3s;
      }

      .toggle-password {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.3s;
      }

      .toggle-password:hover {
        color: var(--text-secondary);
      }

      .toggle-password i {
        font-size: 18px;
      }

      input {
        width: 100%;
        padding: 16px 50px 16px 50px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        border-radius: 14px;
        font-size: 0.95rem;
        color: var(--text-primary);
        transition: all 0.3s ease;
        outline: none;
        font-family: inherit;
      }

      input:focus {
        background: rgba(255, 255, 255, 0.05);
        border-color: var(--border-focus);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
      }

      .input-wrapper:focus-within i.input-icon {
        color: var(--primary-light);
      }

      input::placeholder {
        color: var(--text-muted);
      }

      /* Password strength meter */
      .strength-meter {
        margin-top: 12px;
      }

      .strength-bar {
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        overflow: hidden;
        display: flex;
        gap: 4px;
      }

      .strength-segment {
        flex: 1;
        height: 100%;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.1);
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .strength-segment.active.weak {
        background: var(--error);
      }
      .strength-segment.active.fair {
        background: var(--warning);
      }
      .strength-segment.active.good {
        background: #22c55e;
      }
      .strength-segment.active.strong {
        background: var(--success);
      }

      .strength-text {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        font-size: 0.75rem;
      }

      .strength-label {
        color: var(--text-muted);
        font-weight: 500;
      }

      .strength-value {
        font-weight: 600;
        transition: color 0.3s;
      }

      .strength-value.weak {
        color: var(--error);
      }
      .strength-value.fair {
        color: var(--warning);
      }
      .strength-value.good {
        color: #22c55e;
      }
      .strength-value.strong {
        color: var(--success);
      }

      /* Requirements checklist */
      .requirements {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }

      .requirement {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.75rem;
        color: var(--text-muted);
        transition: color 0.3s;
      }

      .requirement i {
        font-size: 14px;
        transition: all 0.3s;
      }

      .requirement.met {
        color: var(--success);
      }

      .requirement.met i {
        transform: scale(1.1);
      }

      /* Match indicator */
      .match-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        font-size: 0.8rem;
        opacity: 0;
        transform: translateY(-5px);
        transition: all 0.3s ease;
      }

      .match-indicator.show {
        opacity: 1;
        transform: translateY(0);
      }

      .match-indicator.match {
        color: var(--success);
      }

      .match-indicator.no-match {
        color: var(--error);
      }

      .match-indicator i {
        font-size: 16px;
      }

      /* Input states */
      .input-group.error input {
        border-color: var(--error);
        background: rgba(244, 63, 94, 0.05);
      }

      .input-group.error input:focus {
        box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.15);
      }

      .input-group.error .input-icon {
        color: var(--error) !important;
      }

      .input-group.success input {
        border-color: var(--success);
        background: rgba(16, 185, 129, 0.05);
      }

      .input-group.success input:focus {
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
      }

      .input-group.success .input-icon {
        color: var(--success) !important;
      }

      /* Field error */
      .field-error {
        display: none;
        font-size: 0.8rem;
        color: var(--error);
        margin-top: 8px;
        animation: slideIn 0.3s ease;
      }

      .field-error.show {
        display: block;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Submit button */
      .primary-btn {
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--accent) 100%
        );
        color: white;
        padding: 16px 24px;
        border-radius: 14px;
        font-size: 0.95rem;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        margin-top: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: inherit;
        position: relative;
        overflow: hidden;
      }

      .primary-btn::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.2) 0%,
          transparent 50%
        );
        opacity: 0;
        transition: opacity 0.3s;
      }

      .primary-btn:hover::before {
        opacity: 1;
      }

      .primary-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 40px rgba(99, 102, 241, 0.4);
      }

      .primary-btn:active {
        transform: translateY(0);
      }

      .primary-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .primary-btn i {
        font-size: 20px;
      }

      /* Messages */
      .errorMsg,
      .successMsg {
        display: none;
        padding: 14px 18px;
        border-radius: 12px;
        font-size: 0.85rem;
        margin-top: 20px;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        animation: messageIn 0.4s ease;
      }

      @keyframes messageIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .errorMsg {
        background: rgba(244, 63, 94, 0.1);
        border: 1px solid rgba(244, 63, 94, 0.2);
        color: #fda4af;
      }

      .successMsg {
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.2);
        color: #6ee7b7;
      }

      .errorMsg.show,
      .successMsg.show {
        display: flex;
      }

      .errorMsg i,
      .successMsg i {
        font-size: 18px;
      }

      /* Back link */
      .back-link {
        margin-top: 28px;
        text-align: center;
        padding-top: 24px;
        border-top: 1px solid var(--border);
      }

      .link-btn {
        background: none;
        border: none;
        color: var(--text-secondary);
        font-weight: 500;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.85rem;
        padding: 8px 16px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s;
      }

      .link-btn:hover {
        color: var(--text-primary);
        background: rgba(255, 255, 255, 0.05);
      }

      .link-btn i {
        font-size: 16px;
        transition: transform 0.3s;
      }

      .link-btn:hover i {
        transform: translateX(-3px);
      }

      /* Spinner animation */
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .ph-spinner {
        animation: spin 1s linear infinite;
      }

      /* Responsive */
      @media (max-width: 500px) {
        body {
          padding: 20px 16px;
        }

        .card {
          padding: 36px 24px;
        }

        h2 {
          font-size: 1.4rem;
        }

        .requirements {
          grid-template-columns: 1fr;
        }

        .lock-container {
          width: 64px;
          height: 64px;
          border-radius: 18px;
        }

        .lock-container i {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Background effects -->
    <div class="bg-mesh"></div>
    <div class="aurora"></div>
    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>

    <!-- Main card -->
    <div class="card">
      <div class="header">
        <a href="/" class="logo-spark">
          Header<i class="ph-fill ph-sparkle"></i>
        </a>

        <h2>Create New Password</h2>
        <p class="subtitle">Secure your account with a strong password</p>
      </div>

      <form id="changePasswordForm">
        <div class="input-group" data-field="newPassword">
          <label for="newPassword">New Password</label>
          <div class="input-wrapper">
            <i class="ph ph-lock input-icon"></i>
            <input
              type="password"
              id="newPassword"
              name="newPassword"
              placeholder="Enter new password"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="toggle-password"
              data-target="newPassword"
            >
              <i class="ph ph-eye"></i>
            </button>
          </div>
          <div class="field-error" data-error="newPassword"></div>

          <!-- Strength meter -->
          <div class="strength-meter" id="strengthMeter">
            <div class="strength-bar">
              <div class="strength-segment" data-segment="1"></div>
              <div class="strength-segment" data-segment="2"></div>
              <div class="strength-segment" data-segment="3"></div>
              <div class="strength-segment" data-segment="4"></div>
              <div class="strength-segment" data-segment="5"></div>
            </div>
            <div class="strength-text">
              <span class="strength-label">Password strength</span>
              <span class="strength-value" id="strengthValue">—</span>
            </div>
          </div>

          <!-- Requirements -->
          <div class="requirements">
            <div class="requirement" data-req="length">
              <i class="ph ph-circle"></i>
              <span>8+ characters</span>
            </div>
            <div class="requirement" data-req="uppercase">
              <i class="ph ph-circle"></i>
              <span>Uppercase</span>
            </div>
            <div class="requirement" data-req="lowercase">
              <i class="ph ph-circle"></i>
              <span>Lowercase</span>
            </div>
            <div class="requirement" data-req="number">
              <i class="ph ph-circle"></i>
              <span>Number</span>
            </div>
            <div class="requirement" data-req="special">
              <i class="ph ph-circle"></i>
              <span>Special character</span>
            </div>
          </div>
        </div>

        <div class="input-group" data-field="confirmPassword">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrapper">
            <i class="ph ph-lock-key input-icon"></i>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm new password"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="toggle-password"
              data-target="confirmPassword"
            >
              <i class="ph ph-eye"></i>
            </button>
          </div>
          <div class="field-error" data-error="confirmPassword"></div>
          <div class="match-indicator" id="matchIndicator">
            <i class="ph"></i>
            <span></span>
          </div>
        </div>

        <button type="submit" class="primary-btn" id="submitBtn">
          <i class="ph ph-shield-check"></i>
          Update Password
        </button>
      </form>

      <p class="errorMsg" id="errorMsg">
        <i class="ph ph-warning-circle"></i>
        <span></span>
      </p>
      <p class="successMsg" id="successMsg">
        <i class="ph ph-check-circle"></i>
        <span></span>
      </p>

      <div class="back-link">
        <button id="backBtn" class="link-btn">
          <i class="ph ph-arrow-left"></i>
          Back to Feed
        </button>
      </div>
    </div>

    <script>
      const formElem = document.getElementById("changePasswordForm");
      const newPasswordInput = document.getElementById("newPassword");
      const confirmPasswordInput = document.getElementById("confirmPassword");
      const matchIndicator = document.getElementById("matchIndicator");
      const errorMsgElem = document.getElementById("errorMsg");
      const successMsgElem = document.getElementById("successMsg");
      const submitBtn = document.getElementById("submitBtn");
      const backBtn = document.getElementById("backBtn");
      const strengthValue = document.getElementById("strengthValue");

      // Toggle password visibility
      document.querySelectorAll(".toggle-password").forEach((btn) => {
        btn.addEventListener("click", () => {
          const targetId = btn.dataset.target;
          const input = document.getElementById(targetId);
          const icon = btn.querySelector("i");

          if (input.type === "password") {
            input.type = "text";
            icon.className = "ph ph-eye-slash";
          } else {
            input.type = "password";
            icon.className = "ph ph-eye";
          }
        });
      });

      backBtn.addEventListener("click", () => {
        window.location.href = "/content";
      });

      function clearErrors() {
        document.querySelectorAll(".input-group").forEach((g) => {
          g.classList.remove("error", "success");
        });
        document.querySelectorAll(".field-error").forEach((e) => {
          e.classList.remove("show");
          e.innerHTML = "";
        });
        matchIndicator.classList.remove("show", "match", "no-match");
        errorMsgElem.classList.remove("show");
        successMsgElem.classList.remove("show");
      }

      function showFieldErrors(errors) {
        const grouped = {};
        for (const err of errors) {
          if (!grouped[err.field]) grouped[err.field] = [];
          grouped[err.field].push(err.message);
        }

        for (const [field, messages] of Object.entries(grouped)) {
          const group = document.querySelector(`[data-field="${field}"]`);
          const errorDiv = document.querySelector(`[data-error="${field}"]`);
          if (group && errorDiv) {
            group.classList.add("error");
            errorDiv.innerHTML = messages.join("<br>");
            errorDiv.classList.add("show");
          }
        }
      }

      // Password strength checker
      function checkPasswordStrength(password) {
        const requirements = {
          length: password.length >= 8,
          uppercase: /[A-Z]/.test(password),
          lowercase: /[a-z]/.test(password),
          number: /[0-9]/.test(password),
          special: /[^a-zA-Z0-9]/.test(password),
        };

        // Update requirement indicators
        for (const [req, met] of Object.entries(requirements)) {
          const el = document.querySelector(`[data-req="${req}"]`);
          if (el) {
            el.classList.toggle("met", met);
            el.querySelector("i").className = met
              ? "ph-fill ph-check-circle"
              : "ph ph-circle";
          }
        }

        // Calculate strength
        const metCount = Object.values(requirements).filter(Boolean).length;
        const segments = document.querySelectorAll(".strength-segment");

        let strengthClass = "";
        let strengthText = "—";

        if (password.length === 0) {
          strengthText = "—";
        } else if (metCount === 1) {
          strengthClass = "weak";
          strengthText = "Weak";
        } else if (metCount === 2) {
          strengthClass = "fair";
          strengthText = "Fair";
        } else if (metCount === 3) {
          strengthClass = "fair";
          strengthText = "Fair";
        } else if (metCount === 4) {
          strengthClass = "good";
          strengthText = "Good";
        } else if (metCount === 5) {
          strengthClass = "strong";
          strengthText = "Strong";
        }

        segments.forEach((seg, i) => {
          seg.classList.remove("active", "weak", "fair", "good", "strong");
          if (password.length > 0 && i < metCount) {
            seg.classList.add("active", strengthClass);
          }
        });

        strengthValue.textContent = strengthText;
        strengthValue.className = "strength-value " + strengthClass;

        return requirements;
      }

      function checkPasswordMatch() {
        const newPass = newPasswordInput.value;
        const confirmPass = confirmPasswordInput.value;
        const confirmGroup = document.querySelector(
          '[data-field="confirmPassword"]'
        );

        if (confirmPass.length === 0) {
          matchIndicator.classList.remove("show", "match", "no-match");
          confirmGroup.classList.remove("success", "error");
          return false;
        }

        matchIndicator.classList.add("show");

        if (newPass === confirmPass) {
          matchIndicator.classList.remove("no-match");
          matchIndicator.classList.add("match");
          matchIndicator.querySelector("i").className =
            "ph-fill ph-check-circle";
          matchIndicator.querySelector("span").textContent = "Passwords match";
          confirmGroup.classList.remove("error");
          confirmGroup.classList.add("success");
          return true;
        } else {
          matchIndicator.classList.remove("match");
          matchIndicator.classList.add("no-match");
          matchIndicator.querySelector("i").className = "ph ph-x-circle";
          matchIndicator.querySelector("span").textContent =
            "Passwords don't match";
          confirmGroup.classList.remove("success");
          confirmGroup.classList.add("error");
          return false;
        }
      }

      // Real-time validation
      newPasswordInput.addEventListener("input", () => {
        checkPasswordStrength(newPasswordInput.value);
        if (confirmPasswordInput.value.length > 0) {
          checkPasswordMatch();
        }
      });

      confirmPasswordInput.addEventListener("input", checkPasswordMatch);

      formElem.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearErrors();

        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        // Client-side validation
        const errors = [];
        const requirements = checkPasswordStrength(newPassword);

        if (!newPassword) {
          errors.push({
            field: "newPassword",
            message: "Password is required",
          });
        } else if (!Object.values(requirements).every(Boolean)) {
          errors.push({
            field: "newPassword",
            message: "Password doesn't meet all requirements",
          });
        }

        if (!confirmPassword) {
          errors.push({
            field: "confirmPassword",
            message: "Please confirm your password",
          });
        } else if (newPassword !== confirmPassword) {
          errors.push({
            field: "confirmPassword",
            message: "Passwords don't match",
          });
        }

        if (errors.length > 0) {
          showFieldErrors(errors);
          return;
        }

        // Disable button during submission
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="ph ph-spinner"></i> Updating...';

        try {
          const params = new URLSearchParams(window.location.search);
          const token = params.get("token");
          console.log(token);
          const response = await fetch("/change-pass", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: newPassword, token: token }),
          });

          if (response.ok) {
            successMsgElem.querySelector("span").textContent =
              "Password updated successfully!";
            successMsgElem.classList.add("show");
            formElem.reset();
            checkPasswordStrength("");
            matchIndicator.classList.remove("show");
            document
              .querySelector('[data-field="confirmPassword"]')
              .classList.remove("success");

            setTimeout(() => {
              window.location.href = "/log-in";
            }, 2000);
          } else if (response.status === 400) {
            const errors = await response.json();
            showFieldErrors(errors);
          } else if (response.status === 401) {
            errorMsgElem.querySelector("span").textContent =
              "Session expired. Please log in again.";
            errorMsgElem.classList.add("show");
          } else if (response.status === 429) {
            errorMsgElem.querySelector("span").textContent =
              "Too many attempts. Please wait and try again.";
            errorMsgElem.classList.add("show");
          } else if (response.status === 403) {
            errorMsgElem.querySelector("span").textContent =
              "New password must differ from old password!";
            errorMsgElem.classList.add("show");
          } else {
            errorMsgElem.querySelector("span").textContent =
              "Something went wrong. Please try again.";
            errorMsgElem.classList.add("show");
          }
        } catch (err) {
          console.error(err);
          errorMsgElem.querySelector("span").textContent =
            "Connection error. Please try again.";
          errorMsgElem.classList.add("show");
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML =
            '<i class="ph ph-shield-check"></i> Update Password';
        }
      });
    </script>
  </body>
</html>
