<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Header</title>
    <link rel="icon" href="HeaDer.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
      :root {
        --primary: #2563eb;
        --primary-dark: #4669e5;
        --primary-light: #81a7f8;
        --accent: #5575f7;
        --accent-light: #84befc;
        --dark: #0a0a0f;
        --dark-soft: #13131a;
        --card-bg: rgba(20, 20, 30, 0.8);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --border: rgba(255, 255, 255, 0.08);
        --border-focus: rgba(99, 102, 241, 0.5);
        --error: #f43f5e;
        --success: #10b981;
        --warning: #f59e0b;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        background: var(--dark);
        position: relative;
        overflow-x: hidden;
      }

      /* Mesh gradient background */
      .bg-mesh {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(
            ellipse 80% 50% at 20% -10%,
            rgba(15, 55, 141, 0.25) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse 60% 40% at 80% 100%,
            rgba(22, 42, 131, 0.2) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse 50% 30% at 50% 50%,
            rgba(13, 37, 109, 0.05) 0%,
            transparent 50%
          );
      }

      /* Animated aurora effect */
      .aurora {
        position: fixed;
        top: -50%;
        left: -50%;
        right: -50%;
        bottom: -50%;
        background: conic-gradient(
          from 180deg at 50% 50%,
          transparent 0deg,
          rgba(99, 102, 241, 0.03) 60deg,
          transparent 120deg,
          rgba(168, 85, 247, 0.03) 180deg,
          transparent 240deg,
          rgba(99, 102, 241, 0.03) 300deg,
          transparent 360deg
        );
        animation: auroraRotate 60s linear infinite;
      }

      @keyframes auroraRotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /* Floating particles */
      .particles {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .particle {
        position: absolute;
        width: 2px;
        height: 2px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        animation: particleFloat 20s linear infinite;
      }

      .particle:nth-child(1) {
        left: 10%;
        animation-delay: 0s;
        animation-duration: 25s;
      }
      .particle:nth-child(2) {
        left: 20%;
        animation-delay: -5s;
        animation-duration: 20s;
      }
      .particle:nth-child(3) {
        left: 30%;
        animation-delay: -10s;
        animation-duration: 28s;
      }
      .particle:nth-child(4) {
        left: 40%;
        animation-delay: -15s;
        animation-duration: 22s;
      }
      .particle:nth-child(5) {
        left: 50%;
        animation-delay: -2s;
        animation-duration: 26s;
      }
      .particle:nth-child(6) {
        left: 60%;
        animation-delay: -8s;
        animation-duration: 24s;
      }
      .particle:nth-child(7) {
        left: 70%;
        animation-delay: -12s;
        animation-duration: 21s;
      }
      .particle:nth-child(8) {
        left: 80%;
        animation-delay: -18s;
        animation-duration: 27s;
      }
      .particle:nth-child(9) {
        left: 90%;
        animation-delay: -4s;
        animation-duration: 23s;
      }

      @keyframes particleFloat {
        0% {
          transform: translateY(100vh) scale(0);
          opacity: 0;
        }
        10% {
          opacity: 1;
          transform: translateY(90vh) scale(1);
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateY(-10vh) scale(0.5);
          opacity: 0;
        }
      }

      /* Main card */
      .card {
        position: relative;
        z-index: 10;
        background: var(--card-bg);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        padding: 48px 44px;
        border-radius: 28px;
        border: 1px solid var(--border);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05) inset,
          0 25px 50px -12px rgba(0, 0, 0, 0.5),
          0 0 100px rgba(99, 102, 241, 0.1);
        width: 100%;
        max-width: 420px;
        animation: cardEntry 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 60%;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
      }

      @keyframes cardEntry {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* Header */
      .header {
        text-align: center;
        margin-bottom: 36px;
      }

      .logo-spark {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--text-primary);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
        margin-bottom: 28px;
        transition: transform 0.3s ease;
      }

      .logo-spark:hover {
        transform: scale(1.03);
      }

      .logo-spark i {
        font-size: 20px;
        color: #2563eb;
        margin-bottom: 8px;
        animation: sparkle 2s ease-in-out infinite;
      }

      @keyframes sparkle {
        0%,
        100% {
          opacity: 0.7;
          transform: rotate(0deg) scale(1);
        }
        50% {
          opacity: 1;
          transform: rotate(10deg) scale(1.1);
        }
      }

      /* Icon container */
      .icon-container {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        animation: iconPulse 3s ease-in-out infinite;
      }

      .icon-container::before {
        content: "";
        position: absolute;
        inset: -2px;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        border-radius: 22px;
        z-index: -1;
        opacity: 0.5;
        filter: blur(12px);
      }

      .icon-container i {
        font-size: 32px;
        color: white;
      }

      @keyframes iconPulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4);
        }
        50% {
          box-shadow: 0 0 0 12px rgba(99, 102, 241, 0);
        }
      }

      h2 {
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 30px;
        letter-spacing: -0.02em;
      }

      .subtitle {
        color: var(--text-secondary);
        font-size: 0.9rem;
        line-height: 1.6;
      }

      /* Form */
      form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .input-wrapper {
        position: relative;
      }

      .input-wrapper i.input-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 20px;
        transition: color 0.3s;
      }

      input {
        width: 100%;
        padding: 16px 16px 16px 50px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        border-radius: 14px;
        font-size: 0.95rem;
        color: var(--text-primary);
        transition: all 0.3s ease;
        outline: none;
        font-family: inherit;
      }

      input:focus {
        background: rgba(255, 255, 255, 0.05);
        border-color: var(--border-focus);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
      }

      .input-wrapper:focus-within i.input-icon {
        color: var(--primary-light);
      }

      input::placeholder {
        color: var(--text-muted);
      }

      /* Input states */
      .input-group.error input {
        border-color: var(--error);
        background: rgba(244, 63, 94, 0.05);
      }

      .input-group.error input:focus {
        box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.15);
      }

      .input-group.error .input-icon {
        color: var(--error) !important;
      }

      .input-group.success input {
        border-color: var(--success);
        background: rgba(16, 185, 129, 0.05);
      }

      .input-group.success input:focus {
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
      }

      .input-group.success .input-icon {
        color: var(--success) !important;
      }

      /* Field error */
      .field-error {
        display: none;
        font-size: 0.8rem;
        color: var(--error);
        margin-top: 8px;
        animation: slideIn 0.3s ease;
      }

      .field-error.show {
        display: block;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Submit button */
      .primary-btn {
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--accent) 100%
        );
        color: white;
        padding: 16px 24px;
        border-radius: 14px;
        font-size: 0.95rem;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        margin-top: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: inherit;
        position: relative;
        overflow: hidden;
      }

      .primary-btn::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.2) 0%,
          transparent 50%
        );
        opacity: 0;
        transition: opacity 0.3s;
      }

      .primary-btn:hover::before {
        opacity: 1;
      }

      .primary-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 40px rgba(99, 102, 241, 0.4);
      }

      .primary-btn:active {
        transform: translateY(0);
      }

      .primary-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .primary-btn i {
        font-size: 20px;
      }

      /* Messages */
      .errorMsg,
      .successMsg {
        display: none;
        padding: 14px 18px;
        border-radius: 12px;
        font-size: 0.85rem;
        margin-top: 20px;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        animation: messageIn 0.4s ease;
      }

      @keyframes messageIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .errorMsg {
        background: rgba(244, 63, 94, 0.1);
        border: 1px solid rgba(244, 63, 94, 0.2);
        color: #fda4af;
      }

      .successMsg {
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.2);
        color: #6ee7b7;
      }

      .errorMsg.show,
      .successMsg.show {
        display: flex;
      }

      .errorMsg i,
      .successMsg i {
        font-size: 18px;
        flex-shrink: 0;
      }

      /* Back link */
      .back-link {
        margin-top: 28px;
        text-align: center;
        padding-top: 24px;
        border-top: 1px solid var(--border);
      }

      .link-btn {
        background: none;
        border: none;
        color: var(--text-secondary);
        font-weight: 500;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.85rem;
        padding: 8px 16px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s;
      }

      .link-btn:hover {
        color: var(--text-primary);
        background: rgba(255, 255, 255, 0.05);
      }

      .link-btn i {
        font-size: 16px;
        transition: transform 0.3s;
      }

      .link-btn:hover i {
        transform: translateX(-3px);
      }

      .linkToVerify {
        color: var(--accent);
        text-decoration: none;
      }

      .linkToVerify:hover {
        text-decoration: underline;
      }

      .forgot-link {
        font-size: 0.85rem;
        color: var(--primary-light);
        text-decoration: none;
        font-weight: 500;
        padding: 6px 12px;
        border-radius: 8px;
        transition: all 0.2s ease;
      }

      .forgot-link:hover {
        color: var(--text-primary);
        background: rgba(255, 255, 255, 0.05);
      }

      .pDivVerify {
        margin-bottom: 19px;
      }

      /* Spinner animation */
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .ph-spinner {
        animation: spin 1s linear infinite;
      }

      /* Responsive */
      @media (max-width: 500px) {
        body {
          padding: 20px 16px;
        }

        .card {
          padding: 36px 24px;
        }

        h2 {
          font-size: 1.4rem;
        }

        .icon-container {
          width: 64px;
          height: 64px;
          border-radius: 18px;
        }

        .icon-container i {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Background effects -->
    <div class="bg-mesh"></div>
    <div class="aurora"></div>
    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>

    <!-- Main card -->
    <div class="card">
      <div class="header">
        <a href="/" class="logo-spark">
          Header<i class="ph-fill ph-sparkle"></i>
        </a>

        <h2>Forgot Password?</h2>
        <p class="subtitle">
          No worries! Enter your email and we'll send you a link to reset your
          password.
        </p>
      </div>

      <form id="forgotPasswordForm">
        <div class="input-group" data-field="email">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <i class="ph ph-envelope input-icon"></i>
            <input
              type="text"
              id="email"
              name="email"
              placeholder="Enter your email"
              autocomplete="email"
            />
          </div>
          <div class="field-error" data-error="email"></div>
        </div>

        <button type="submit" class="primary-btn" id="submitBtn">
          <i class="ph ph-paper-plane-tilt"></i>
          Send Reset Link
        </button>
      </form>

      <p class="errorMsg" id="errorMsg">
        <i class="ph ph-warning-circle"></i>
        <span></span>
      </p>
      <p class="successMsg" id="successMsg">
        <i class="ph ph-check-circle"></i>
        <span></span>
      </p>

      <div class="back-link">
        <p class="subtitle pDivVerify">
          Need to verify your email before changing your password?
          <a href="/resend-verification" class="forgot-link"
            >Resend verification email</a
          >
        </p>
        <button id="backBtn" class="link-btn">
          <i class="ph ph-arrow-left"></i>
          Back to Login
        </button>
      </div>
    </div>

    <script>
      const formElem = document.getElementById("forgotPasswordForm");
      const emailInput = document.getElementById("email");
      const errorMsgElem = document.getElementById("errorMsg");
      const successMsgElem = document.getElementById("successMsg");
      const submitBtn = document.getElementById("submitBtn");
      const backBtn = document.getElementById("backBtn");
      const resendBtn = document.getElementById("resendVerificationBtn");

      backBtn.addEventListener("click", () => {
        window.location.href = "/log-in";
      });

      function clearErrors() {
        document.querySelectorAll(".input-group").forEach((g) => {
          g.classList.remove("error", "success");
        });
        document.querySelectorAll(".field-error").forEach((e) => {
          e.classList.remove("show");
          e.innerHTML = "";
        });
        errorMsgElem.classList.remove("show");
        successMsgElem.classList.remove("show");
      }

      function showFieldError(field, message) {
        const group = document.querySelector(`[data-field="${field}"]`);
        const errorDiv = document.querySelector(`[data-error="${field}"]`);
        if (group && errorDiv) {
          group.classList.add("error");
          errorDiv.textContent = message;
          errorDiv.classList.add("show");
        }
      }

      function validateEmail(email) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return emailRegex.test(email);
      }

      // Clear error on input
      emailInput.addEventListener("input", () => {
        const group = document.querySelector('[data-field="email"]');
        group.classList.remove("error");
        document.querySelector('[data-error="email"]').classList.remove("show");
      });

      formElem.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearErrors();

        const email = emailInput.value.trim();

        // Client-side validation
        if (!email) {
          showFieldError("email", "Email is required");
          emailInput.focus();
          return;
        }

        if (!validateEmail(email)) {
          showFieldError("email", "Please enter a valid email address");
          emailInput.focus();
          return;
        }

        // Disable button during submission
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="ph ph-spinner"></i> Sending...';

        try {
          const response = await fetch("/request-reset", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email }),
          });

          if (response.ok) {
            successMsgElem.querySelector("span").textContent =
              "If this email exists, is verified and is not associated with Google, a reset link has been sent!";
            successMsgElem.classList.add("show");
            formElem.reset();

            // Mark email as success
            const group = document.querySelector('[data-field="email"]');
            group.classList.add("success");
          } else if (response.status === 400) {
            const errors = await response.json();
            if (Array.isArray(errors) && errors.length > 0) {
              showFieldError(errors[0].field, errors[0].message);
            }
          } else if (response.status === 429) {
            errorMsgElem.querySelector("span").textContent =
              "Too many attempts. Please wait and try again.";
            errorMsgElem.classList.add("show");
          } else {
            errorMsgElem.querySelector("span").textContent =
              "Something went wrong. Please try again.";
            errorMsgElem.classList.add("show");
          }
        } catch (err) {
          console.error(err);
          errorMsgElem.querySelector("span").textContent =
            "Connection error. Please try again.";
          errorMsgElem.classList.add("show");
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML =
            '<i class="ph ph-paper-plane-tilt"></i> Send Reset Link';
        }
      });
    </script>
  </body>
</html>
