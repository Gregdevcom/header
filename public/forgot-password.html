<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Header</title>
    <link rel="icon" href="HeaDer.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ephesis&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        overscroll-behavior: none;
      }

      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(160deg, #1a1a2e, #16213e, #0f3460);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        overscroll-behavior: none;
        overflow-x: hidden;
        width: 100%;
        height: 100%;
      }

      /* Main card */
      .card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 30px;
        padding: 50px 40px;
        width: 100%;
        max-width: 420px;
        animation: cardEntry 0.6s ease-out;
      }

      @keyframes cardEntry {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Header */
      .header {
        text-align: center;
        margin-bottom: 35px;
      }

      .logo {
        font-family: "Ephesis", cursive;
        font-weight: 400;
        font-size: 38px;
        font-weight: 300;
        letter-spacing: 2px;
        color: #fff;
        text-decoration: none;
        display: inline-block;
        margin-bottom: 8px;
      }

      .subtitle {
        color: rgba(255, 255, 255, 0.4);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 3px;
        margin-bottom: 20px;
      }

      .description {
        color: rgba(255, 255, 255, 0.5);
        font-size: 14px;
        line-height: 1.6;
      }

      /* Form */
      form {
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 11px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.5);
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .input-wrapper {
        position: relative;
      }

      .input-wrapper i.input-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.3);
        font-size: 20px;
        transition: color 0.3s;
      }

      input {
        width: 100%;
        padding: 16px 50px;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        font-size: 15px;
        color: #fff;
        transition: all 0.3s ease;
        outline: none;
        font-family: inherit;
      }

      input:focus {
        background: rgba(0, 0, 0, 0.3);
        border-color: rgba(255, 255, 255, 0.25);
      }

      .input-wrapper:focus-within i.input-icon {
        color: rgba(255, 255, 255, 0.6);
      }

      input::placeholder {
        color: rgba(255, 255, 255, 0.3);
      }

      /* Input states */
      .input-group.error input {
        border-color: #ff4757;
        background: rgba(255, 71, 87, 0.1);
      }

      .input-group.error .input-icon {
        color: #ff4757 !important;
      }

      .input-group.success input {
        border-color: #2ed573;
        background: rgba(46, 213, 115, 0.1);
      }

      .input-group.success .input-icon {
        color: #2ed573 !important;
      }

      /* Field error */
      .field-error {
        display: none;
        font-size: 12px;
        color: #ff6b81;
        margin-top: 8px;
        animation: slideIn 0.3s ease;
      }

      .field-error.show {
        display: block;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Submit button */
      .primary-btn {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: rgba(255, 255, 255, 0.9);
        padding: 16px 24px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: inherit;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .primary-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
      }

      .primary-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
      }

      .primary-btn i {
        font-size: 18px;
      }

      /* Messages */
      .errorMsg,
      .successMsg {
        display: none;
        padding: 14px 18px;
        border-radius: 12px;
        font-size: 13px;
        margin-top: 20px;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        animation: messageIn 0.4s ease;
      }

      @keyframes messageIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .errorMsg {
        background: rgba(255, 71, 87, 0.15);
        border: 1px solid rgba(255, 71, 87, 0.3);
        color: #ff6b81;
      }

      .successMsg {
        background: rgba(46, 213, 115, 0.15);
        border: 1px solid rgba(46, 213, 115, 0.3);
        color: #7bed9f;
      }

      .errorMsg.show,
      .successMsg.show {
        display: flex;
      }

      .errorMsg i,
      .successMsg i {
        font-size: 18px;
        flex-shrink: 0;
      }

      /* Back link section */
      .back-link {
        margin-top: 30px;
        text-align: center;
        padding-top: 25px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .pDivVerify {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.5);
        margin-bottom: 16px;
        line-height: 1.6;
      }

      .forgot-link {
        color: rgba(255, 255, 255, 0.7);
        text-decoration: none;
        font-weight: 600;
        padding: 4px 8px;
        padding-bottom: 6px;
        border-radius: 6px;
        transition: all 0.3s;
      }

      .forgot-link:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.05);
      }

      .link-btn {
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.5);
        font-weight: 500;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        padding: 8px 16px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s;
      }

      .link-btn:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.05);
      }

      .link-btn i {
        font-size: 16px;
        transition: transform 0.3s;
      }

      .link-btn:hover i {
        transform: translateX(-3px);
      }

      /* Spinner animation */
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .ph-spinner {
        animation: spin 1s linear infinite;
      }

      /* Responsive */
      @media (max-width: 500px) {
        body {
          padding: 16px;
        }

        .card {
          padding: 40px 28px;
          border-radius: 24px;
        }

        .logo {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Main card -->
    <div class="card">
      <div class="header">
        <a href="/" class="logo">Auris</a>
        <p class="subtitle">Reset Password</p>

        <p class="description">
          Forgot your password? No worries! Enter your email and we'll send you
          a link to reset your password.
        </p>
      </div>

      <form id="forgotPasswordForm">
        <div class="input-group" data-field="email">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <i class="ph ph-envelope input-icon"></i>
            <input
              type="text"
              id="email"
              name="email"
              placeholder="Enter your email"
              autocomplete="email"
            />
          </div>
          <div class="field-error" data-error="email"></div>
        </div>

        <button type="submit" class="primary-btn" id="submitBtn">
          <i class="ph ph-paper-plane-tilt"></i>
          Send Reset Link
        </button>
      </form>

      <p class="errorMsg" id="errorMsg">
        <i class="ph ph-warning-circle"></i>
        <span></span>
      </p>
      <p class="successMsg" id="successMsg">
        <i class="ph ph-check-circle"></i>
        <span></span>
      </p>

      <div class="back-link">
        <p class="pDivVerify">
          Need to verify your email before changing your password?
          <a href="/resend-verification" class="forgot-link"
            >Resend verification email</a
          >
        </p>
        <button id="backBtn" class="link-btn">
          <i class="ph ph-arrow-left"></i>
          Back to Login
        </button>
      </div>
    </div>

    <script>
      const formElem = document.getElementById("forgotPasswordForm");
      const emailInput = document.getElementById("email");
      const errorMsgElem = document.getElementById("errorMsg");
      const successMsgElem = document.getElementById("successMsg");
      const submitBtn = document.getElementById("submitBtn");
      const backBtn = document.getElementById("backBtn");
      const resendBtn = document.getElementById("resendVerificationBtn");

      backBtn.addEventListener("click", () => {
        window.location.href = "/log-in";
      });

      function clearErrors() {
        document.querySelectorAll(".input-group").forEach((g) => {
          g.classList.remove("error", "success");
        });
        document.querySelectorAll(".field-error").forEach((e) => {
          e.classList.remove("show");
          e.innerHTML = "";
        });
        errorMsgElem.classList.remove("show");
        successMsgElem.classList.remove("show");
      }

      function showFieldError(field, message) {
        const group = document.querySelector(`[data-field="${field}"]`);
        const errorDiv = document.querySelector(`[data-error="${field}"]`);
        if (group && errorDiv) {
          group.classList.add("error");
          errorDiv.textContent = message;
          errorDiv.classList.add("show");
        }
      }

      function validateEmail(email) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return emailRegex.test(email);
      }

      // Clear error on input
      emailInput.addEventListener("input", () => {
        const group = document.querySelector('[data-field="email"]');
        group.classList.remove("error");
        document.querySelector('[data-error="email"]').classList.remove("show");
      });

      formElem.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearErrors();

        const email = emailInput.value.trim();

        // Client-side validation
        if (!email) {
          showFieldError("email", "Email is required");
          emailInput.focus();
          return;
        }

        if (!validateEmail(email)) {
          showFieldError("email", "Please enter a valid email address");
          emailInput.focus();
          return;
        }

        // Disable button during submission
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="ph ph-spinner"></i> Sending...';

        try {
          const response = await fetch("/request-reset", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email }),
          });

          if (response.ok) {
            successMsgElem.querySelector("span").textContent =
              "If this email exists, is verified and is not associated with Google, a reset link has been sent!";
            successMsgElem.classList.add("show");
            formElem.reset();

            // Mark email as success
            const group = document.querySelector('[data-field="email"]');
            group.classList.add("success");
          } else if (response.status === 400) {
            const errors = await response.json();
            if (Array.isArray(errors) && errors.length > 0) {
              showFieldError(errors[0].field, errors[0].message);
            }
          } else if (response.status === 429) {
            errorMsgElem.querySelector("span").textContent =
              "Too many attempts. Please wait and try again.";
            errorMsgElem.classList.add("show");
          } else {
            errorMsgElem.querySelector("span").textContent =
              "Something went wrong. Please try again.";
            errorMsgElem.classList.add("show");
          }
        } catch (err) {
          console.error(err);
          errorMsgElem.querySelector("span").textContent =
            "Connection error. Please try again.";
          errorMsgElem.classList.add("show");
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML =
            '<i class="ph ph-paper-plane-tilt"></i> Send Reset Link';
        }
      });
    </script>
  </body>
</html>
