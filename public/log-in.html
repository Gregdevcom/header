<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In | Header</title>
    <link rel="icon" href="HeaDer.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ephesis&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        overscroll-behavior: none;
      }

      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(160deg, #1a1a2e, #16213e, #0f3460);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        overflow-x: hidden;
      }

      /* Main card */
      .card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 30px;
        padding: 50px 40px;
        width: 100%;
        max-width: 420px;
        animation: cardEntry 0.6s ease-out;
      }

      @keyframes cardEntry {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Header */
      .header {
        text-align: center;
        margin-bottom: 35px;
      }

      .logo {
        font-family: "Ephesis", cursive;
        font-weight: 400;
        font-size: 38px;
        font-weight: 300;
        letter-spacing: 2px;
        color: #fff;
        text-decoration: none;
        display: inline-block;
        margin-bottom: 8px;
      }

      .subtitle {
        color: rgba(255, 255, 255, 0.4);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 3px;
      }

      /* Social buttons */
      .social-buttons {
        margin-bottom: 25px;
      }

      .google-btn {
        width: 100%;
        padding: 16px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.05);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-size: 14px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.9);
        transition: all 0.3s ease;
        font-family: inherit;
        text-decoration: none;
        letter-spacing: 0.5px;
      }

      .google-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.25);
        transform: translateY(-2px);
      }

      .google-btn svg {
        flex-shrink: 0;
      }

      /* Divider */
      .divider {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 25px;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
      }

      .divider span {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.4);
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      /* Form */
      form {
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 11px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.5);
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .input-wrapper {
        position: relative;
      }

      .input-wrapper i.input-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.3);
        font-size: 20px;
        transition: color 0.3s;
      }

      .toggle-password {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.3);
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.3s;
      }

      .toggle-password:hover {
        color: rgba(255, 255, 255, 0.6);
      }

      .toggle-password i {
        font-size: 18px;
      }

      input {
        width: 100%;
        padding: 16px 50px;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        font-size: 15px;
        color: #fff;
        transition: all 0.3s ease;
        outline: none;
        font-family: inherit;
      }

      input:focus {
        background: rgba(0, 0, 0, 0.3);
        border-color: rgba(255, 255, 255, 0.25);
      }

      .input-wrapper:focus-within i.input-icon {
        color: rgba(255, 255, 255, 0.6);
      }

      input::placeholder {
        color: rgba(255, 255, 255, 0.3);
      }

      /* Form options */
      .form-options {
        display: flex;
        justify-content: flex-end;
        margin-top: -8px;
      }

      .forgot-link {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
        text-decoration: none;
        padding: 6px 10px;
        border-radius: 6px;
        transition: all 0.3s;
        letter-spacing: 0.5px;
      }

      .forgot-link:hover {
        color: rgba(255, 255, 255, 0.8);
        background: rgba(255, 255, 255, 0.05);
      }

      /* Submit button - glass morphism style */
      .submit-btn {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: rgba(255, 255, 255, 0.9);
        padding: 16px 24px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: inherit;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .submit-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
      }

      .submit-btn:active {
        transform: translateY(0);
      }

      .submit-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
      }

      .submit-btn i {
        font-size: 18px;
      }

      /* Error message */
      .errorMsg {
        display: none;
        padding: 14px 18px;
        border-radius: 12px;
        font-size: 13px;
        margin-top: 20px;
        align-items: center;
        gap: 10px;
        text-align: left;
        animation: messageIn 0.4s ease;
        background: rgba(255, 71, 87, 0.15);
        border: 1px solid rgba(255, 71, 87, 0.3);
        color: #ff6b81;
      }

      .errorMsg.show {
        display: flex;
      }

      .errorMsg i {
        font-size: 18px;
        flex-shrink: 0;
      }

      @keyframes messageIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Switch auth */
      .switch-auth {
        margin-top: 30px;
        text-align: center;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.5);
        padding-top: 25px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .link-btn {
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.7);
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        padding: 4px 8px;
        margin-left: 4px;
        padding-bottom: 5px;
        border-radius: 6px;
        transition: all 0.3s;
        text-decoration: none;
      }

      .link-btn:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.05);
      }

      /* Spinner */
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .ph-spinner {
        animation: spin 1s linear infinite;
      }

      /* Responsive */
      @media (max-width: 500px) {
        body {
          padding: 16px;
        }

        .card {
          padding: 40px 28px;
          border-radius: 24px;
        }

        .logo {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Main card -->
    <div class="card">
      <div class="header">
        <a href="/" class="logo">Auris</a>
        <p class="subtitle">Welcome Back</p>
      </div>

      <div class="social-buttons">
        <a href="/auth/google" class="google-btn">
          <svg width="18" height="18" viewBox="0 0 18 18">
            <path
              fill="#4285F4"
              d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"
            />
            <path
              fill="#34A853"
              d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"
            />
            <path
              fill="#FBBC05"
              d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"
            />
            <path
              fill="#EA4335"
              d="M8.98 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59a8 8 0 0 0-12.17 2.07l2.67 2.07a4.8 4.8 0 0 1 4.48-3.9z"
            />
          </svg>
          Continue with Google
        </a>
      </div>

      <div class="divider">
        <span>or</span>
      </div>

      <form method="POST" id="credentialsForm">
        <div class="input-group">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <i class="ph ph-envelope input-icon"></i>
            <input
              type="text"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
            />
          </div>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="ph ph-lock input-icon"></i>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="toggle-password"
              data-target="password"
            >
              <i class="ph ph-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-options">
          <a href="/forgot-password" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          Sign In
          <i class="ph ph-arrow-right"></i>
        </button>
      </form>

      <div class="errorMsg" id="credentialsErr">
        <i class="ph ph-warning-circle"></i>
        <span>Incorrect email or password.</span>
      </div>

      <div class="switch-auth">
        Don't have an account?
        <a href="/sign-up" class="link-btn">Sign up free</a>
      </div>
    </div>

    <script>
      const formElem = document.getElementById("credentialsForm");
      const errorMsgElem = document.getElementById("credentialsErr");
      const submitBtn = document.getElementById("submitBtn");

      const params = new URLSearchParams(window.location.search);
      const error = params.get("error");

      if (error === "google_failed") {
        errorMsgElem.innerHTML =
          '<i class="ph ph-warning-circle"></i><span>Google sign-in didn\'t complete. Please try again or use another sign-in method.</span>';
        errorMsgElem.classList.add("show");
      }

      // Toggle password visibility
      document.querySelectorAll(".toggle-password").forEach((btn) => {
        btn.addEventListener("click", () => {
          const targetId = btn.dataset.target;
          const input = document.getElementById(targetId);
          const icon = btn.querySelector("i");

          if (input.type === "password") {
            input.type = "text";
            icon.className = "ph ph-eye-slash";
          } else {
            input.type = "password";
            icon.className = "ph ph-eye";
          }
        });
      });

      formElem.addEventListener("submit", async (e) => {
        e.preventDefault();

        errorMsgElem.classList.remove("show");

        const formData = new FormData(formElem);
        const data = Object.fromEntries(formData.entries());

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="ph ph-spinner"></i> Signing in...';

        try {
          const response = await fetch("/log-in", {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });

          if (response.ok) {
            window.location.href = "/content";
          } else if (response.status === 429) {
            errorMsgElem.innerHTML =
              '<i class="ph ph-warning-circle"></i><span>Too many attempts. Please wait and try again.</span>';
            errorMsgElem.classList.add("show");
          } else if (response.status === 400) {
            errorMsgElem.innerHTML =
              '<i class="ph ph-warning-circle"></i><span>This account can\'t be accessed with Google. Please sign in using your original method.</span>';
            errorMsgElem.classList.add("show");
          } else {
            errorMsgElem.innerHTML =
              '<i class="ph ph-warning-circle"></i><span>Incorrect email or password. If you registered with Google, use Sign in with Google.</span>';
            errorMsgElem.classList.add("show");
          }
        } catch (e) {
          console.log(`Login error: ${e}`);
          errorMsgElem.innerHTML =
            '<i class="ph ph-warning-circle"></i><span>Something went wrong. Please try again.</span>';
          errorMsgElem.classList.add("show");
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Sign In <i class="ph ph-arrow-right"></i>';
        }
      });
    </script>
  </body>
</html>
